# Demo databases for trying QueryLens with dev/sequelize-demo (same data in both), and a
# MongoDB for trying the SDK with the driver or Mongoose.
#   docker compose -f dev/docker-compose.yml up -d postgres   (or: mysql, mongo)
# Connect with (dev only):
#   PostgreSQL  postgres://querylens@localhost:54329/shop (no password)
#   MySQL       mysql://querylens:querylens@localhost:33069/shop
#   MongoDB     mongodb://localhost:27019/shop
services:
  postgres:
    image: postgres:17
    container_name: querylens-pg
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: querylens
      POSTGRES_PASSWORD: querylens
      # Dev only: the demo app connects without a password.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro

  mysql:
    image: mysql:8.4
    container_name: querylens-mysql
    environment:
      MYSQL_ROOT_PASSWORD: querylens
      MYSQL_DATABASE: shop
      MYSQL_USER: querylens
      MYSQL_PASSWORD: querylens
    ports:
      - "33069:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./mysql-seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro

  mongo:
    image: mongo:8.0
    container_name: querylens-mongo
    ports:
      - "27019:27017"
    volumes:
      - mongodata:/data/db

volumes:
  # Survive `docker compose down` (only `down -v` wipes them).
  pgdata:
  mysqldata:
  mongodata:
