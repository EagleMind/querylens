# Local Postgres for QueryLens development.
#   docker compose -f dev/docker-compose.yml up -d --build
# Connect with: host=localhost port=54329 db=shop user=querylens (trust auth, dev only)
# Optional IMDB / Join Order Benchmark database: dev/load-job.sh
services:
  postgres:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    image: querylens-pg:17
    container_name: querylens-pg
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: querylens
      POSTGRES_PASSWORD: querylens
      # Dev only: lets automated tests connect without touching the OS keychain.
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      # Enough cache for IMDB's hot indexes; the 128 MB default makes JOB queries
      # re-read gigabytes from disk on every run.
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
    shm_size: 1g
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro

volumes:
  # Survives `docker compose down` (only `down -v` wipes it).
  pgdata:
