# The demo database for trying QueryLens with dev/sequelize-demo.
#   docker compose -f dev/docker-compose.yml up -d
# Connect with (dev only): host=localhost port=54329 db=shop user=querylens (no password)
services:
  postgres:
    image: postgres:17
    container_name: querylens-pg
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: querylens
      POSTGRES_PASSWORD: querylens
      # Dev only: the demo app connects without a password.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro

volumes:
  # Survives `docker compose down` (only `down -v` wipes it).
  pgdata:
