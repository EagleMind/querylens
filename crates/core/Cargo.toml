[package]
name = "querylens-core"
version = "0.1.0"
description = "QueryLens's pure analysis: SQL fingerprints and shapes, ORM pattern detection, ORM-specific fixes. No I/O, builds for WebAssembly."
license = "MIT"
repository = "https://github.com/EagleMind/querylens"
edition = "2024"
rust-version = "1.90"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
percent-encoding = "2.3.2"
serde_json = "1.0.151"
ts-rs = "12.0.1"
