name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: Node.js SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "integrations/node/*.test.cjs"

  core:
    name: Rust core (tests, WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace
      - run: cargo build --locked -p querylens-wasm --release --target wasm32-unknown-unknown
      - uses: actions/upload-artifact@v4
        with:
          name: querylens-core-wasm
          path: target/wasm32-unknown-unknown/release/querylens_wasm.wasm

  cloud:
    name: Backend and dashboard (Cloudflare)
    needs: core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cloud/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cloud/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Build with the module CI just compiled, not the committed one.
      - uses: actions/download-artifact@v4
        with:
          name: querylens-core-wasm
          path: cloud/core
      - run: mv core/querylens_wasm.wasm core/querylens_core.wasm
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
