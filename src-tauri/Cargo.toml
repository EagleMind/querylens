[package]
name = "querylens"
version = "0.1.0"
description = "Local-first query profiler for PostgreSQL, MySQL, MongoDB and DuckDB, with an AI advisor"
authors = ["QueryLens contributors"]
license = "MIT"
repository = "https://github.com/EagleMind/querylens"
edition = "2024"
rust-version = "1.90"
default-run = "querylens"

[lib]
name = "querylens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "querylens"
path = "src/main.rs"

[features]
default = ["gui"]
# The desktop app. Without it the binary is the headless CLI (capture, check, mcp),
# which builds without WebView system libraries, e.g. on CI runners.
gui = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-log"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.5", features = ["derive"] }
dirs = "7.0.0"
duckdb = { version = "1.10506.0", features = ["bundled"] }
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
json5 = "1.3.1"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
log = "0.4.34"
mongodb = "3.9.1"
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "native-tls-tls"] }
native-tls = "0.2.18"
percent-encoding = "2.3.2"
postgres-native-tls = "0.5.3"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-log = { version = "2", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net", "signal"] }
tokio-native-tls = "0.3.1"
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
ts-rs = "12.0.1"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }
which = "8.0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
