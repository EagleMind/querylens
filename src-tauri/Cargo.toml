[package]
name = "querylens"
version = "0.1.0"
description = "Local-first SQL query plan profiler with AI suggestions"
authors = ["QueryLens contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"
default-run = "querylens"

[lib]
name = "querylens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "querylens"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
async-trait = "0.1.92"
chrono = "0.4.45"
dirs = "7.0.0"
duckdb = { version = "1.10506.0", features = ["bundled"] }
futures-util = "0.3.34"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
log = "0.4.34"
native-tls = "0.2.18"
postgres-native-tls = "0.5.3"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = "2.12"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
ts-rs = "12.0.1"
uuid = { version = "1.28.0", features = ["v4"] }
which = "8.0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
